name: Flow Map Brasil

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execução: auto, completo, sabado, quarta ou dia-comum"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - completo
          - sabado
          - quarta
          - dia-comum

  # Sábado 11:00 UTC = 08:00 BRT (Brasília UTC-3): relatórios semanais.
  # Terça e quinta 22:00 UTC = 19:00 BRT (Brasília UTC-3): The Hit List.
  schedule:
    - cron: "0 11 * * 6"
    - cron: "0 22 * * 2,4"

jobs:
  flowmap:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TOKEN_BRAPI: ${{ secrets.TOKEN_BRAPI }}
      TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
      CHAT_ID_TELEGRAM: ${{ secrets.CHAT_ID_TELEGRAM }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mantem o repositorio ativo: o GitHub desliga agendamentos de repos sem
      # alteracoes por ~60 dias. Um commit semanal reseta esse relogio.
      - name: Sinal de vida (mantem o agendamento ativo)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          if git diff --cached --quiet; then
            echo "nada novo para registrar"
          else
            git commit -m "chore: sinal de vida $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run Flow Map Brasil
        env:
          MODO_INPUT: ${{ github.event.inputs.modo || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          modo="$MODO_INPUT"
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "0 22 * * 2,4" ]; then
            modo="quarta"
          fi
          python main.py --modo "$modo"
