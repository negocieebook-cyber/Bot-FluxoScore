name: Flow Map Brasil

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execução: auto, completo, sabado, quarta ou dia-comum"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - completo
          - sabado
          - quarta
          - dia-comum

  # Sábado 11:00 UTC = 08:00 BRT (Brasília UTC-3): relatórios semanais.
  # Quarta 12:00 UTC = 09:00 BRT (Brasília UTC-3): The Hit List.
  schedule:
    - cron: "0 11 * * 6"
    - cron: "0 12 * * 3"

jobs:
  flowmap:
    runs-on: ubuntu-latest

    env:
      TOKEN_BRAPI: ${{ secrets.TOKEN_BRAPI }}
      TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
      CHAT_ID_TELEGRAM: ${{ secrets.CHAT_ID_TELEGRAM }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run Flow Map Brasil
        run: python main.py --modo "${{ github.event.inputs.modo || 'auto' }}"
